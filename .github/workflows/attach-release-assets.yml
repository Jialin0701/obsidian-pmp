name: Attach Obsidian Release Assets

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  attach:
    if: github.event.head_commit.message == 'chore: attach release assets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload 1.9.0 main.js manifest.json styles.css --repo "$GITHUB_REPOSITORY" --clobber
